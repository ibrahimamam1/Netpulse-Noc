# All site containers and noc-core share one image (topology/Dockerfile).

x-site: &site
  image: netpulse-node:latest
  build:
    context: ./topology
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  stop_grace_period: 5s

services:
  noc-core:
    <<: *site
    container_name: noc-core
    hostname: noc-core
    # Idle in foreground so ping / nc / ip route can be run via docker exec.
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 1; done"]
    networks:
      wan_primary:
        ipv4_address: 172.20.1.10
      wan_backup:
        ipv4_address: 172.20.2.10

  site-douala:
    <<: *site
    container_name: site-douala
    hostname: site-douala
    environment:
      SITE_NAME: douala
      PRIMARY_DELAY_MS: "10"
      PRIMARY_JITTER_MS: "1"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "45"
      BACKUP_JITTER_MS: "8"
      BACKUP_LOSS_PCT: "0.1"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.11
      wan_backup:
        ipv4_address: 172.20.2.11

  site-yaounde:
    <<: *site
    container_name: site-yaounde
    hostname: site-yaounde
    environment:
      SITE_NAME: yaounde
      PRIMARY_DELAY_MS: "12"
      PRIMARY_JITTER_MS: "1"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "50"
      BACKUP_JITTER_MS: "8"
      BACKUP_LOSS_PCT: "0.1"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.12
      wan_backup:
        ipv4_address: 172.20.2.12

  site-edge:
    <<: *site
    container_name: site-edge
    hostname: site-edge
    environment:
      SITE_NAME: edge
      PRIMARY_DELAY_MS: "18"
      PRIMARY_JITTER_MS: "2"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "65"
      BACKUP_JITTER_MS: "12"
      BACKUP_LOSS_PCT: "0.2"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.13
      wan_backup:
        ipv4_address: 172.20.2.13

networks:
  wan_primary:
    name: wan_primary
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.1
  wan_backup:
    name: wan_backup
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.1