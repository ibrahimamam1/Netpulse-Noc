
# Site containers share one image (topology/Dockerfile); noc-core builds the C++ prober (prober/Dockerfile);
# noc-engine builds the Python analytics service (engine/Dockerfile);
# noc-controller builds the failover controller (controller/Dockerfile);
# prometheus + grafana (monitoring/) provide the live NOC dashboard.

x-site: &site
  image: netpulse-node:latest
  build:
    context: ./topology
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  stop_grace_period: 5s

services:
  noc-core:
    image: netpulse-prober:latest
    build:
      context: ./prober
    container_name: noc-core
    hostname: noc-core
    cap_add:
      - NET_ADMIN   # dynamic route updates (later layers)
      - NET_RAW     # raw ICMP sockets for the prober
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      - site-douala
      - site-yaounde
      - site-edge
    ports:
      - "9100:9100"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.10
      wan_backup:
        ipv4_address: 172.20.2.10

  noc-engine:
    image: netpulse-engine:latest
    build:
      context: ./engine
    container_name: noc-engine
    hostname: noc-engine
    restart: unless-stopped
    depends_on:
      - noc-core
    environment:
      PROBER_URL: "http://172.20.1.10:9100/api/v1/telemetry"
      POLL_INTERVAL_S: "1.0"
      WARMUP_SAMPLES: "30"
      EWMA_ALPHA: "0.2"
      ZSCORE_THRESHOLD: "3.0"
      CONSECUTIVE_HITS_K: "3"
      SLA_TARGET_PCT: "99.9"
      SLA_WINDOW_SECONDS: "3600"
      HTTP_PORT: "9200"
    ports:
      - "9200:9200"
    volumes:
      - engine_data:/app/data
    networks:
      wan_primary:
        ipv4_address: 172.20.1.20

  noc-controller:
    image: netpulse-controller:latest
    build:
      context: ./controller
    container_name: noc-controller
    hostname: noc-controller
    restart: unless-stopped
    depends_on:
      - noc-core
      - noc-engine
    environment:
      ENGINE_URL: "http://172.20.1.20:9200/api/v1/status"
      POLL_INTERVAL_S: "0.5"
      CORE_CONTAINER_NAME: "noc-core"
      HOLD_DOWN_SECONDS: "20"
      FLAP_WINDOW_SECONDS: "120"
      FLAP_MAX_TRANSITIONS: "3"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      HTTP_PORT: "9300"
    ports:
      - "9300:9300"
    volumes:
      # Grants the controller `docker exec` into noc-core. Root-equivalent access to the
      # Docker host: acceptable for this lab, not for production.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      wan_primary:
        ipv4_address: 172.20.1.30

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    depends_on:
      - noc-core
      - noc-engine
      - noc-controller
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      wan_primary:
        ipv4_address: 172.20.1.40

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Zero-click demo access: anyone opening http://localhost:3000 lands on the NOC dashboard.
      # (Anonymous *Admin* + no login form: fine for a local demo, never expose this publicly.)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/noc_overview.json"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"   # default is 5s, which would clamp the 2s auto-refresh
      GF_USERS_DEFAULT_THEME: "dark"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      wan_primary:
        ipv4_address: 172.20.1.41

  site-douala:
    <<: *site
    container_name: site-douala
    hostname: site-douala
    environment:
      SITE_NAME: douala
      LAN_IP: "10.10.1.1/32"
      PRIMARY_DELAY_MS: "10"
      PRIMARY_JITTER_MS: "1"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "45"
      BACKUP_JITTER_MS: "8"
      BACKUP_LOSS_PCT: "0.1"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.11
      wan_backup:
        ipv4_address: 172.20.2.11

  site-yaounde:
    <<: *site
    container_name: site-yaounde
    hostname: site-yaounde
    environment:
      SITE_NAME: yaounde
      LAN_IP: "10.10.2.1/32"
      PRIMARY_DELAY_MS: "12"
      PRIMARY_JITTER_MS: "1"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "50"
      BACKUP_JITTER_MS: "8"
      BACKUP_LOSS_PCT: "0.1"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.12
      wan_backup:
        ipv4_address: 172.20.2.12

  site-edge:
    <<: *site
    container_name: site-edge
    hostname: site-edge
    environment:
      SITE_NAME: edge
      LAN_IP: "10.10.3.1/32"
      PRIMARY_DELAY_MS: "18"
      PRIMARY_JITTER_MS: "2"
      PRIMARY_LOSS_PCT: "0"
      BACKUP_DELAY_MS: "65"
      BACKUP_JITTER_MS: "12"
      BACKUP_LOSS_PCT: "0.2"
      TCP_PROBE_PORT: "8080"
    networks:
      wan_primary:
        ipv4_address: 172.20.1.13
      wan_backup:
        ipv4_address: 172.20.2.13

volumes:
  engine_data:
  prometheus_data:

networks:
  wan_primary:
    name: wan_primary
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.1
  wan_backup:
    name: wan_backup
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.1